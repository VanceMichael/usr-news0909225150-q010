services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: navigation
      POSTGRES_USER: navigation
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigation -d navigation"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://navigation:local-development-only@postgres:5432/navigation
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 一条命令验收：
  #   docker compose up --build --abort-on-container-exit acceptance
  acceptance:
    build: .
    environment:
      DATABASE_URL: postgres://navigation:local-development-only@postgres:5432/navigation
      ENABLE_TEST_GATES: "1"
      PORT: "18080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "scripts/acceptance.sh"]

volumes:
  pgdata:
