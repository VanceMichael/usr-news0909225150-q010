services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: navigation
      POSTGRES_USER: navigation
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigation -d navigation"]
      interval: 2s
      timeout: 2s
      retries: 15
  domain-check:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
